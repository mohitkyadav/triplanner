[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — all routes serve the app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the service worker or the app shell
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed assets are immutable
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
